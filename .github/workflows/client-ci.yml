name: Client CI

on:
  push:
    branches: [main, pre-deploy, dev]
    paths:
      - 'client/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, pre-deploy, dev]
    paths:
      - 'client/**'
      - '.github/workflows/**'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install deps
        working-directory: client
        run: npm ci
      - name: Lint
        working-directory: client
        run: npm run lint
      - name: Typecheck
        working-directory: client
        run: |
          if npm run -q typecheck; then exit 0; else echo "No typecheck script"; fi
      - name: Build
        working-directory: client
        run: npm run build
